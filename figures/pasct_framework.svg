<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#344054"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#3B6EA8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, "Noto Sans SC", sans-serif; fill: #182230; }
      .section { font: 700 21px Arial, "Noto Sans SC", sans-serif; fill: #344054; }
      .head { font: 700 19px Arial, "Noto Sans SC", sans-serif; fill: #182230; }
      .body { font: 16px Arial, "Noto Sans SC", sans-serif; fill: #344054; }
      .small { font: 14px Arial, "Noto Sans SC", sans-serif; fill: #475467; }
      .formula { font: italic 17px Georgia, "Times New Roman", serif; fill: #182230; }
      .group { fill: #FFFFFF; stroke: #98A2B3; stroke-width: 1.7; stroke-dasharray: 8 7; rx: 12; }
      .box { fill: #FFFFFF; stroke: #667085; stroke-width: 1.6; rx: 9; }
      .blue { fill: #EAF2FB; stroke: #3B6EA8; stroke-width: 1.8; rx: 9; }
      .orange { fill: #FFF2E5; stroke: #C8792D; stroke-width: 1.8; rx: 9; }
      .green { fill: #EAF6EF; stroke: #3D8058; stroke-width: 1.8; rx: 9; }
      .purple { fill: #F2EDFA; stroke: #7656A8; stroke-width: 1.8; rx: 9; }
      .gray { fill: #F2F4F7; stroke: #667085; stroke-width: 1.6; rx: 9; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.1; marker-end: url(#arrow); }
      .arrowBlue { fill: none; stroke: #3B6EA8; stroke-width: 2.3; marker-end: url(#arrow-blue); }
      .dashArrow { fill: none; stroke: #667085; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .divider { stroke: #98A2B3; stroke-width: 1.5; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="940" fill="#FFFFFF"/>
  <text x="800" y="48" text-anchor="middle" class="title">Perception-Aware Scenario Certificate Training (PASCT)</text>
  <text x="800" y="77" text-anchor="middle" class="body">A general framework for discrete-time perception-in-the-loop control systems</text>

  <!-- Offline area -->
  <rect x="34" y="104" width="1532" height="580" class="group"/>
  <text x="58" y="137" class="section">Offline learning and certification</text>

  <!-- System specification -->
  <rect x="62" y="167" width="260" height="468" class="group"/>
  <text x="192" y="201" text-anchor="middle" class="head">Task specification</text>

  <rect x="88" y="225" width="208" height="112" class="blue"/>
  <text x="192" y="255" text-anchor="middle" class="head">State-space sets</text>
  <text x="192" y="284" text-anchor="middle" class="formula">X, X₀, Xg, Xu</text>
  <text x="192" y="312" text-anchor="middle" class="small">domain · initial · goal · unsafe</text>

  <rect x="88" y="361" width="208" height="112" class="orange"/>
  <text x="192" y="391" text-anchor="middle" class="head">Uncertainty models</text>
  <text x="192" y="420" text-anchor="middle" class="formula">ξ ∼ Pξ ,  w ∼ Pw</text>
  <text x="192" y="448" text-anchor="middle" class="small">perception error · process noise</text>

  <rect x="88" y="497" width="208" height="112" class="gray"/>
  <text x="192" y="527" text-anchor="middle" class="head">System interfaces</text>
  <text x="192" y="556" text-anchor="middle" class="formula">y = O(x,ξ)</text>
  <text x="192" y="583" text-anchor="middle" class="formula">x⁺ = F(x,u,w)</text>

  <!-- Soft training -->
  <rect x="358" y="167" width="298" height="468" class="group"/>
  <text x="507" y="201" text-anchor="middle" class="head">Stage I · Soft pre-training</text>

  <rect x="390" y="232" width="234" height="86" class="green"/>
  <text x="507" y="263" text-anchor="middle" class="head">Task policy</text>
  <text x="507" y="291" text-anchor="middle" class="formula">u = πθ(y)</text>

  <rect x="390" y="350" width="234" height="104" class="purple"/>
  <text x="507" y="381" text-anchor="middle" class="head">Certificate network</text>
  <text x="507" y="410" text-anchor="middle" class="formula">B(x)=wᵀφψ(x)+b</text>
  <text x="507" y="436" text-anchor="middle" class="small">learnable feature extractor φψ</text>

  <rect x="390" y="487" width="234" height="98" class="box"/>
  <text x="507" y="518" text-anchor="middle" class="head">Sample-based loss</text>
  <text x="507" y="547" text-anchor="middle" class="small">task performance</text>
  <text x="507" y="570" text-anchor="middle" class="small">+ certificate violations</text>

  <path d="M507 487 L507 463" class="arrow"/>
  <path d="M468 487 C442 455 442 344 476 321" class="arrow"/>

  <!-- Freeze -->
  <rect x="693" y="302" width="126" height="132" class="gray"/>
  <text x="756" y="338" text-anchor="middle" class="head">Freeze</text>
  <text x="756" y="370" text-anchor="middle" class="formula">πθ</text>
  <text x="756" y="398" text-anchor="middle" class="formula">φψ</text>
  <text x="756" y="421" text-anchor="middle" class="small">fixed</text>
  <path d="M656 367 L686 367" class="arrow"/>

  <!-- Scenario certification -->
  <rect x="856" y="167" width="482" height="468" class="group"/>
  <text x="1097" y="201" text-anchor="middle" class="head">Stage II · Scenario certification</text>

  <rect x="882" y="231" width="190" height="94" class="orange"/>
  <text x="977" y="260" text-anchor="middle" class="head">Stratified scenarios</text>
  <text x="977" y="289" text-anchor="middle" class="formula">zᵢ=(xᵢ,ξᵢ,wᵢ)</text>
  <text x="977" y="312" text-anchor="middle" class="small">domain · initial · unsafe · dynamics</text>

  <rect x="1118" y="231" width="194" height="94" class="blue"/>
  <text x="1215" y="260" text-anchor="middle" class="head">Closed-loop step</text>
  <text x="1215" y="287" text-anchor="middle" class="formula">yᵢ=O(xᵢ,ξᵢ)</text>
  <text x="1215" y="312" text-anchor="middle" class="formula">xᵢ⁺=F(xᵢ,π(yᵢ),wᵢ)</text>

  <path d="M1072 278 L1110 278" class="arrow"/>

  <rect x="882" y="370" width="190" height="94" class="purple"/>
  <text x="977" y="400" text-anchor="middle" class="head">Feature extraction</text>
  <text x="977" y="429" text-anchor="middle" class="formula">φψ(xᵢ), φψ(xᵢ⁺)</text>
  <text x="977" y="451" text-anchor="middle" class="small">fixed neural features</text>

  <rect x="1118" y="370" width="194" height="94" class="green"/>
  <text x="1215" y="400" text-anchor="middle" class="head">Scenario LP</text>
  <text x="1215" y="429" text-anchor="middle" class="formula">optimize w, b, β</text>
  <text x="1215" y="451" text-anchor="middle" class="small">linear certificate constraints</text>

  <path d="M1215 325 C1215 347 1088 348 1010 368" class="arrow"/>
  <path d="M1072 417 L1110 417" class="arrow"/>

  <rect x="951" y="511" width="292" height="88" class="box"/>
  <text x="1097" y="542" text-anchor="middle" class="head">Independent holdout evaluation</text>
  <text x="1097" y="571" text-anchor="middle" class="small">constraint residual · violation rate · rollout</text>
  <path d="M1215 464 C1215 490 1176 502 1145 509" class="arrow"/>

  <!-- Inputs to scenario stage -->
  <path d="M819 368 C840 368 842 278 874 278" class="arrow"/>
  <path d="M296 417 C330 417 332 151 977 151 L977 223" class="dashArrow"/>
  <path d="M296 552 C340 552 340 647 1215 647 L1215 607" class="dashArrow"/>

  <!-- Output -->
  <rect x="1375" y="167" width="163" height="468" class="group"/>
  <text x="1456" y="201" text-anchor="middle" class="head">Outputs</text>

  <rect x="1394" y="235" width="125" height="102" class="purple"/>
  <text x="1456" y="266" text-anchor="middle" class="head">Certificate</text>
  <text x="1456" y="296" text-anchor="middle" class="formula">B*(x)</text>
  <text x="1456" y="320" text-anchor="middle" class="small">fixed policy</text>

  <rect x="1394" y="369" width="125" height="116" class="green"/>
  <text x="1456" y="400" text-anchor="middle" class="head">PAC bound</text>
  <text x="1456" y="431" text-anchor="middle" class="formula">Pr ≥ 1−δ</text>
  <text x="1456" y="459" text-anchor="middle" class="formula">P(violation) ≤ ε</text>

  <rect x="1394" y="517" width="125" height="84" class="box"/>
  <text x="1456" y="548" text-anchor="middle" class="head">Metrics</text>
  <text x="1456" y="576" text-anchor="middle" class="small">JSON + report</text>

  <path d="M1312 417 L1386 417" class="arrow"/>
  <path d="M1243 555 C1320 555 1338 285 1386 285" class="arrow"/>
  <path d="M1243 572 L1386 572" class="arrow"/>

  <!-- Divider -->
  <line x1="34" y1="716" x2="1566" y2="716" class="divider"/>
  <text x="58" y="752" class="section">Online deployment · no safety filter and no certificate optimizer</text>

  <!-- Online closed loop -->
  <rect x="104" y="786" width="222" height="92" class="blue"/>
  <text x="215" y="819" text-anchor="middle" class="head">Sensor / image</text>
  <text x="215" y="849" text-anchor="middle" class="small">raw observation</text>

  <rect x="402" y="786" width="222" height="92" class="blue"/>
  <text x="513" y="819" text-anchor="middle" class="head">Semantic perception</text>
  <text x="513" y="849" text-anchor="middle" class="formula">y = O(x,ξ)</text>

  <rect x="700" y="786" width="222" height="92" class="green"/>
  <text x="811" y="819" text-anchor="middle" class="head">Standalone policy</text>
  <text x="811" y="849" text-anchor="middle" class="formula">u = πθ(y)</text>

  <rect x="998" y="786" width="222" height="92" class="orange"/>
  <text x="1109" y="819" text-anchor="middle" class="head">Physical system</text>
  <text x="1109" y="849" text-anchor="middle" class="formula">x⁺ = F(x,u,w)</text>

  <rect x="1296" y="786" width="200" height="92" class="gray"/>
  <text x="1396" y="819" text-anchor="middle" class="head">Next state</text>
  <text x="1396" y="849" text-anchor="middle" class="formula">x ← x⁺</text>

  <path d="M326 832 L394 832" class="arrowBlue"/>
  <path d="M624 832 L692 832" class="arrowBlue"/>
  <path d="M922 832 L990 832" class="arrowBlue"/>
  <path d="M1220 832 L1288 832" class="arrowBlue"/>
  <path d="M1396 878 C1396 916 215 916 215 886" class="arrowBlue"/>

  <!-- Offline-to-online transfer -->
  <path d="M507 318 C507 702 811 702 811 778" class="dashArrow"/>
  <text x="635" y="699" class="small">deploy frozen policy</text>

  <!-- Legend -->
  <line x1="1185" y1="752" x2="1234" y2="752" class="arrowBlue"/>
  <text x="1244" y="758" class="small">online data flow</text>
  <line x1="1370" y1="752" x2="1419" y2="752" class="dashArrow"/>
  <text x="1429" y="758" class="small">offline dependency</text>
</svg>
